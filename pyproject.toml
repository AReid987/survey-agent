[project]
name = "survey-agent"
version = "0.1.0"
description = "Agent-driven survey automation system"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49.0",
    "playwright-stealth>=2.0.0",
    "keyring>=25.0.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "browser-use>=0.13.1",
    "langchain-google-genai>=4.2.5",
    "langchain-mistralai>=1.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pylint>=3.2.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "vulture>=2.11",
]

[project.scripts]
survey-agent = "survey_agent.cli:app"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=survey_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pylint]
max-line-length = 120
fail-under = 7.0

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict_optional = true

[tool.bandit]
skips = ["B101"]
