# ── Lefthook Git Hooks ─────────────────────────────────────────────
# Drives all quality gates locally before code ever reaches CI.
# Install: npm install (runs `lefthook install` automatically via prepare script)
# Manual:  npx lefthook install

pre-commit:
  parallel: true
  commands:
    # ── Python linting & formatting ──────────────────────────────
    ruff-lint:
      glob: "*.py"
      run: pdm run ruff check --fix {staged_files}
      stage_fixed: true
      fail_text: "🐍 Ruff lint errors — run `pdm run ruff check` to see details."

    ruff-format:
      glob: "*.py"
      run: pdm run ruff format {staged_files}
      stage_fixed: true
      fail_text: "🐍 Ruff format errors — run `pdm run ruff format` to fix."

    pylint:
      glob: "*.py"
      run: pdm run pylint {staged_files}
      fail_text: "🐍 Pylint score below threshold — fix warnings and retry."

    mypy:
      glob: "*.py"
      run: pdm run mypy {staged_files}
      fail_text: "🐍 Type-checking errors found by mypy."

    # ── Static security & dead-code analysis ─────────────────────
    bandit:
      glob: "*.py"
      run: pdm run bandit -q {staged_files}
      fail_text: "🔒 Bandit security issues detected."

    vulture:
      glob: "*.py"
      run: pdm run vulture {staged_files}
      fail_text: "💀 Vulture found dead/unused code."

    # ── JS/TS/JSON linting & formatting ───────────────────────────
    biome:
      glob: "*.{js,ts,jsx,tsx,json}"
      run: npx @biomejs/biome check --write {staged_files}
      stage_fixed: true
      fail_text: "🦎 Biome lint errors in JS/TS files."

    prettier:
      glob: "*.{json,md,yaml,yml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
      fail_text: "✨ Prettier formatting errors."

    # ── Tests with coverage ──────────────────────────────────────
    pytest:
      run: pdm run pytest --cov --cov-fail-under=80
      fail_text: "🧪 Tests failing or coverage below 80%."

    # ── GitNexus knowledge-graph refresh ─────────────────────────
    gitnexus-analyze:
      run: npx gitnexus analyze
      fail_text: "📊 GitNexus analysis failed — index may be stale."

# ── Commit message validation ─────────────────────────────────────
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
      fail_text: "📝 Commit message must follow Conventional Commits format.\n  https://www.conventionalcommits.org/\n  Use `npm run commit` (czg CLI) to write compliant messages interactively."

# ── Pre-push gates ────────────────────────────────────────────────
pre-push:
  parallel: false
  commands:
    full-test-suite:
      run: pdm run pytest --cov --cov-fail-under=80 -v
      fail_text: "🧪 Pre-push test suite failed — push blocked."

    gitnexus-analyze:
      run: npx gitnexus analyze
      fail_text: "📊 GitNexus analysis failed."

    code-formatting:
      glob: "*.py"
      run: pdm run ruff check --fix {staged_files} && pdm run ruff format {staged_files}
      stage_fixed: true
      fail_text: "🐍 Code formatting issues found."
