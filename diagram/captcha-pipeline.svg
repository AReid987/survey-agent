<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    </style>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.75" fill="rgba(226,228,236,0.06)"/>
    </pattern>

    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e8a839"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9499a6"/>
    </marker>
    <marker id="arrow-go" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#48c99b"/>
    </marker>

    <filter id="glow-red">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="ambient-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(232,168,57,0.025)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#13161c"/>
  <rect width="100%" height="100%" fill="url(#ambient-glow)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="920" height="44" fill="#1a1d24" opacity="0.8"/>
  <text x="30" y="28" fill="#e8a839" font-size="13" font-weight="700" letter-spacing="1.5">CAPTCHA SOLVING PIPELINE</text>
  <line x1="0" y1="44" x2="920" y2="44" stroke="rgba(226,228,236,0.08)" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ENTRY: CaptchaChallenge -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(310, 70)">
    <rect x="0" y="0" width="300" height="46" fill="#242730" stroke="rgba(226,228,236,0.15)" stroke-width="1"/>
    <text x="150" y="22" fill="#e2e4ec" font-size="11" font-weight="600" text-anchor="middle">CaptchaChallenge Detected</text>
    <text x="150" y="38" fill="#9499a6" font-size="8" text-anchor="middle">screenshot · captcha_type · description</text>
  </g>

  <!-- Arrow down -->
  <line x1="460" y1="116" x2="460" y2="150" stroke="#e8a839" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- TIER 1: ArithmeticSolver -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(50, 155)">
    <rect x="0" y="0" width="820" height="60" fill="#1a1d24" stroke="rgba(226,228,236,0.06)" stroke-width="1"/>
    <text x="15" y="16" fill="#9499a6" font-size="9" font-weight="600" letter-spacing="1">TIER 1</text>

    <rect x="15" y="24" width="180" height="26" fill="rgba(72,201,155,0.08)" stroke="#48c99b" stroke-width="1"/>
    <text x="105" y="41" fill="#e2e4ec" font-size="10" font-weight="600" text-anchor="middle">ArithmeticSolver</text>

    <text x="215" y="35" fill="#c2c5cf" font-size="9">10 + 5 = ?</text>
    <text x="215" y="49" fill="#9499a6" font-size="8">Regex extraction · integer ops</text>

    <!-- Arrow to solved -->
    <line x1="460" y1="155" x2="460" y2="130" stroke="#48c99b" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="470" y="148" fill="#48c99b" font-size="8">solved → return</text>

    <!-- Arrow to next tier -->
    <line x1="820" y1="185" x2="850" y2="185" stroke="#9499a6" stroke-width="1" marker-end="url(#arrow-muted)"/>
    <text x="838" y="178" fill="#9499a6" font-size="8">unsolved</text>
  </g>

  <!-- Connector line between tiers -->
  <line x1="870" y1="185" x2="870" y2="225"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- TIER 2: LLMVisionSolver -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="820" height="60" fill="#1a1d24" stroke="rgba(226,228,236,0.06)" stroke-width="1"/>
    <text x="15" y="16" fill="#9499a6" font-size="9" font-weight="600" letter-spacing="1">TIER 2</text>

    <rect x="15" y="24" width="180" height="26" fill="rgba(232,168,57,0.08)" stroke="#e8a839" stroke-width="1"/>
    <text x="105" y="41" fill="#e2e4ec" font-size="10" font-weight="600" text-anchor="middle">LLMVisionSolver</text>

    <text x="215" y="35" fill="#c2c5cf" font-size="9">LLM screenshot analysis</text>
    <text x="215" y="49" fill="#9499a6" font-size="8">Requires llm_fn callable · GPT-4o / Claude vision</text>

    <!-- Arrow to solved -->
    <line x1="460" y1="230" x2="460" y2="205" stroke="#e8a839" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="470" y="223" fill="#e8a839" font-size="8">solved → return</text>

    <!-- Arrow to next tier -->
    <line x1="820" y1="260" x2="850" y2="260" stroke="#9499a6" stroke-width="1" marker-end="url(#arrow-muted)"/>
    <text x="838" y="253" fill="#9499a6" font-size="8">unsolved</text>
  </g>

  <!-- Connector -->
  <line x1="870" y1="260" x2="870" y2="300"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- TIER 3: APICaptchaSolver (optional) -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(50, 305)">
    <rect x="0" y="0" width="820" height="60" fill="#1a1d24" stroke="rgba(226,228,236,0.06)" stroke-width="1"/>
    <text x="15" y="16" fill="#9499a6" font-size="9" font-weight="600" letter-spacing="1">TIER 3</text>

    <rect x="15" y="24" width="180" height="26" fill="rgba(148,120,230,0.08)" stroke="#9478e6" stroke-width="1"/>
    <text x="105" y="41" fill="#e2e4ec" font-size="10" font-weight="600" text-anchor="middle">APICaptchaSolver</text>

    <text x="215" y="35" fill="#c2c5cf" font-size="9">reCAPTCHA / hCAPTCHA</text>
    <text x="215" y="49" fill="#9499a6" font-size="8">2captcha · capsolver · api_key required</text>
    <text x="550" y="41" fill="#9499a6" font-size="8" font-style="italic">optional · requires api_key + api_provider config</text>

    <!-- Arrow to solved -->
    <line x1="460" y1="305" x2="460" y2="280" stroke="#9478e6" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="470" y="298" fill="#9478e6" font-size="8">solved → return</text>

    <!-- Arrow to next tier -->
    <line x1="820" y1="335" x2="850" y2="335" stroke="#9499a6" stroke-width="1" marker-end="url(#arrow-muted)"/>
    <text x="838" y="328" fill="#9499a6" font-size="8">unsolved</text>
  </g>

  <!-- Connector -->
  <line x1="870" y1="335" x2="870" y2="372"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- TIER 4: ManualVNCFallback -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="820" height="60" fill="#1a1d24" stroke="rgba(226,228,236,0.06)" stroke-width="1"/>
    <text x="15" y="16" fill="#9499a6" font-size="9" font-weight="600" letter-spacing="1">TIER 4</text>

    <rect x="15" y="24" width="180" height="26" fill="rgba(212,74,74,0.08)" stroke="#d44a4a" stroke-width="1" filter="url(#glow-red)"/>
    <text x="105" y="41" fill="#e2e4ec" font-size="10" font-weight="600" text-anchor="middle">ManualVNCFallback</text>

    <text x="215" y="35" fill="#c2c5cf" font-size="9">Human operator via VNC</text>
    <text x="215" y="49" fill="#9499a6" font-size="8">Last resort · VNC alert · manual intervention</text>

    <!-- Arrow right -->
    <line x1="720" y1="410" x2="790" y2="410" stroke="#d44a4a" stroke-width="1" marker-end="url(#arrow-amber)"/>
    <text x="753" y="403" fill="#d44a4a" font-size="8">unsolved → fail</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- RESULT BOX -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(130, 465)">
    <rect x="0" y="0" width="660" height="40" fill="#242730" stroke="#48c99b" stroke-width="1"/>
    <text x="330" y="25" fill="#e2e4ec" font-size="11" font-weight="600" text-anchor="middle">CaptchaSolution → solved: boolean · answer: str · method: str</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- INFO BOX -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="200" height="90" fill="#1a1d24" stroke="rgba(226,228,236,0.08)" stroke-width="1"/>
    <text x="10" y="16" fill="#9499a6" font-size="8" font-weight="600" letter-spacing="1">SOLVER TYPES</text>
    <text x="10" y="34" fill="#c2c5cf" font-size="8">ARITHMETIC · IMAGE_SLIDER</text>
    <text x="10" y="48" fill="#c2c5cf" font-size="8">IMAGE_SELECT · TEXT_CHALLENGE</text>
    <text x="10" y="62" fill="#c2c5cf" font-size="8">HCAPTCHA · RECAPTCHA</text>
    <text x="10" y="76" fill="#c2c5cf" font-size="8">UNKNOWN</text>
  </g>
</svg>
